    <style>
        * {

        }

        header {
            font-family: "Gt Pressura Mono", Georgia, sans-serif;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }

        .dm {
            display: flex;
            justify-content: space-between;
            width: 800px;
        }

        .studio {
            width: 200px;
        }

        .lt {
            text-align: right;
            width: 420px;
        }

        .container {
            width: 100%;
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 160px;
            font-family: "Mixtape Extra Condensed", Verdana, sans-serif;
            font-weight: 800;
        }

        .mouse {
            display: none;
            position: absolute;
            width: 300px;
            height: 400px;
            top: 100px;
            left: 0px;
            z-index: 10;
        }
        .vid {
            border-radius: 20px;
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* border: 2px solid black; */
            padding: 0;
            margin: 0;
        }
        .wt,.ca,.des{
            display: flex;
            width: 100%;
            padding: 0;
            margin: 0;
            justify-content: center;
            align-items: center;
        }
        .wt1,.wt2,.wt3,.wt4,.wt5,.wt6,.wt7,.wt8,.ca1,.ca2,.ca3,.ca4,.ca5,.ca6,.ca7,.ca8,.ca9,.des1,.des2,.des3,.des4,.des5,.des6,.des7{
            animation: wt1 1s forwards;
            opacity: 0;
        }
        @keyframes wt1{
            0% {
                transform: translateY(50px);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .wt1{
            animation-delay: 0s;
        }
        .wt2{
            animation-delay: 0.1s;
        }
        .wt3{
            animation-delay: 0.2s;
        }
        .wt4{
            animation-delay: 0.3s;
        }
        .wt5{
            animation-delay: 0.4s;
        }
        .wt6{
            animation-delay: 0.5s;
        }
        .wt7{
            animation-delay: 0.6s;
        }
        .wt8{
            animation-delay: 0.7s;
        }
        .ca1{
            animation-delay: 0s;
        }
        .ca2{
            animation-delay: 0.1s;
        }
        .ca3{
            animation-delay: 0.2s;
        }
        .ca4{
            animation-delay: 0.3s;
        }
        .ca5{
            animation-delay: 0.4s;
        }
        .ca6{
            animation-delay: 0.5s;
        }
        .ca7{
            animation-delay: 0.6s;
        }
        .ca8{
            animation-delay: 0.7s;
        }
        .ca9{
            animation-delay: 0.8s;
        }
        .des1{
            animation-delay: 0s;
        }
        .des2{
            animation-delay: 0.1s;
        }
        .des3{
            animation-delay: 0.2s;
        }
        .des4{
            animation-delay: 0.3s;
        }
        .des5{
            animation-delay: 0.4s;
        }
        .des6{
            animation-delay: 0.5s;
        }
        .des7{
            animation-delay: 0.6s;
        }
        .txt{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

    <script>

        let container = document.querySelector('.container');
        let mouse = document.querySelector('.mouse');
        let prevx = 1;
        let tempdeg = 1;

        container.addEventListener('mousemove', (event) => {
            mouse.style.display = 'block';
            let xcod = event.clientX;
            let ycod = event.clientY;
            mouse.style.left = xcod + 'px';
            mouse.style.top = ycod + 'px';

            if (prevx > xcod) {
                tempdeg -= 1;
                mouse.style.transform = `rotate3d(0,1,0,${tempdeg}deg)`;
            } else {
                tempdeg += 1;
                mouse.style.transform = `rotate3d(0,1,0,${tempdeg}deg)`;
            }
            prevx = xcod;
        })



        // Footer
        let box = document.querySelector('.footer');
        let nammaBoxHeight = 0;
        let isBoxVisible = false;
        window.addEventListener('wheel', (event) => {
            if (event.deltaY > 0) {
                console.log('scrolling up');
                if (isBoxVisible) {
                    document.body.classList.remove('lock-page-scroll');
                    event.preventDefault();
                    nammaBoxHeight += 2;
                    box.style.height = nammaBoxHeight + 'px';
                }
            }


        else if(event.deltaY<0){
            console.log('scrolling down');
            if(nammaBoxHeight>0){
                document.body.classList.add('lock-page-scroll');
                event.preventDefault();
                nammaBoxHeight-=2;
                box.style.height=nammaBoxHeight+'px';
            }
        }
        }

     }, {passive:false})
        const observer=new IntersectionObserver((entries)=>{
            const entry=entries[0];
                if(entry.isIntersecting){
                    console.log('box arrived');
                    console.log(entry.target);
                    isBoxVisible=true;
                }
                else if(!entry.isIntersecting){
                    entry.target.classList.remove('show');
                }
            })
        },
    </script>
